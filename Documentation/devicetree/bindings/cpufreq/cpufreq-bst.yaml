%YAML 1.2
---
$id: http://devicetree.org/schemas/cpufreq/cpufreq-qcom-hw.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Black Sesame Technologies, Inc. CPUFREQ Bindings

maintainers:
  - Xuran Yang <xuran.yang@bst.ai>

description:
  CPUFREQ HW is a hardware engine used by Black Technologies SoCs
  to manage frequency in hardware. It is capable of controlling frequency
  for multiple clusters.


properties:
  compatible:
    contains:
      enum:
        - bst,cpufreq-c1200


  reg:
    minItems: 1
    maxItems: 2
    description:
      Addresses and sizes for the memory of the HW bases in
      each frequency domain. Each entry corresponds to
      a register bank for each frequency domain present.

  clocks:
    items:
      - description: Cluster0 Clock
      - description: Cluster1 Clock

  clock-names:
    items:
      - const: cluster0
      - const: cluster1

  '#freq-domain-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#freq-domain-cells'

additionalProperties: false

examples:
  - |
      cpu_l0: cpu@0 {
        compatible = "arm,cortex-a78", "arm,armv8";
        device_type = "cpu";
        enable-method = "psci";
        next-level-cache = <&l2_0>;
        reg = <0x0>;
        freq-domain = <&cpufreq 0>;
      };
      cpu_b0: cpu@100 {
        compatible = "arm,cortex-a78", "arm,armv8";
        device_type = "cpu";
        enable-method = "psci";
        next-level-cache = <&l2_1>;
        reg = <0x10000>;
        freq-domain = <&cpufreq 1>;
      };

      amba_apu@0 {
        cpufreq: cpufreq@0 {
          compatible = "bst,cpufreq-c1200";
          reg = <0 0x30002000 0 0x1000>;
          clocks= <&scmi_clk GATE_LB_CPU0_MP4_CORE_CLK_EN>,
                  <&scmi_clk GATE_LB_CPU1_MP4_CORE_CLK_EN>;
          clock-names = "cluster0", "cluster1";
          #freq-domain-cells = <1>;
        };
      };
...
