%YAML 1.2
---
$id: "http://devicetree.org/schemas/rng/bst,bst-rng.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: HWRNG support for Black Sesame SOCs

maintainers:
  - Xuran Yang <xuran.yang@bst.ai>

properties:
  compatible:
    enum:
      - bst,c1200-rng

  memory-region:
    maxItems: 1

required:
  - memory-region
  - msgbx-pid

additionalProperties: false

examples:
  - |
    bst-rng@0 {
      status = "okay";
      compatible = "bst,c1200-rng";
      memory-region = <&bst_hwrng_buf_reserved>;
      msgbx-pid = <0x14>;
    };
