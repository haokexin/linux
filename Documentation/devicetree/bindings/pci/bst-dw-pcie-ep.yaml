# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/bst,dw-pcie-ep.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Black Sesame Technologies PCIe EP interface

maintainers:
  - Xuran Yang <xuran.yang@bst.ai>

description: |
  Black Sesame Technologies SOC PCIe EP controller

allOf:
  - $ref: /schemas/pci/pci-bus.yaml#

properties:
  compatible:
    anyOf:
      - {}
      - const: bst,dw-pcie-ep

  reg:
    description:
      - Data Bus Interface (DBI) registers
    minItems: 2
    maxItems: 5

  reg-names:
    minItems: 2
    maxItems: 5
    items:
      enum: [ dbi, dbi2, atu, dma, config]

  num-lanes:
    description: |
      number of lanes to use (this property should be specified unless
      the link is brought already up in firmware)
    maximum: 16

  interrupts: true

  interrupt-names: true

  num-viewport:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 256
    description: |
      number of view ports configured in hardware. If a platform
      does not specify it, the driver autodetects it.
    deprecated: true

additionalProperties: true

required:
  - reg
  - reg-names
  - compatible

examples:
  - |
    bus {
      #address-cells = <0x2>;
      #size-cells = <0x2>;
      pcie0_ep:pcie0_ep@400000000 {
        status = "disable";
        compatible = "bst,dw-pcie-ep";
        device_type = "pci";
        controller-id = <0>;
        chip-type = <0x1>;
        reg =	<0x4 0x00000000 0 0x00080000>,
          <0x4 0x00100000 0 0x00080000>,
          <0x5 0x80000000 0 0x00040000>,
          <0x5 0x80080000 0 0x00040000>,
          <0x0 0x40000000 0 0x80000000>;
        reg-names = "dbi", "dbi2", "atu", "dma", "addr_space";
        num-ib-windows = <16>;
        num-ob-windows = <16>;
        max-functions = /bits/ 8 <8>;
      };
